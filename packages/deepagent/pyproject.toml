[project]
name = "deepagent"
version = "0.1.0"
description = "Aegra 上的 deepagents 图:main(实时语音大脑) + analysis(异步长任务),多租户隔离 + skill 热更新"
requires-python = ">=3.12"
# 对齐 LangChain 1.x;容器启动时按 requirements.txt 安装(不锁死,跟随 Aegra 镜像里的版本)。
dependencies = [
    "deepagents",
    "langchain>=1.0",
    "langchain-openai",
    "langgraph",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagent"]
