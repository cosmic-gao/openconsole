[project]
name = "deepagent"
version = "0.1.0"
description = "Aegra 上的 deepagents 图:main(实时语音大脑) + analysis(异步长任务),多租户隔离 + skill 热更新"
requires-python = ">=3.12"
# 版本按你 Aegra 镜像里实际可用的为准;这里用宽松下限,容器启动时按 requirements.txt 安装。
dependencies = [
    "deepagents>=0.2",
    "langgraph>=0.6",
    "langchain>=0.3",
    "langchain-openai>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagent"]
