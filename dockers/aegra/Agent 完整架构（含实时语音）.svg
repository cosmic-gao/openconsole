<text x="124" y="1196" class="sm" font-size="10.5">每租户一套(租户 B/C… 各自独立 Assistant,同构) · 每 User 一个 Thread = 独立会话 · Thread 间 checkpoint/记忆隔离</text>

<path d="M420,1210 V1226" class="line" marker-end="url(#a)"/>
<rect x="110" y="1228" width="620" height="76" class="bx" rx="8"/>
