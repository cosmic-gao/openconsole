<svg viewBox="0 0 1080 1380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Aegra 完整架构:实时语音 + 多租户会话 + graph静态/assistant动态/skill热更新</title>
<desc>合成图:客户端经实时语音网关(STT/VAD/TTS,WebRTC)接入,音频不进 Aegra;barge-in 打断回路调用 runs cancel;Aegra 控制平面端口 2026;graph 静态(aegra.json,改需重启)、assistant 动态(API 在线创建,每租户一个)、deepagent skill 热更新(存 Store 按租户,写库即生效);多租户四层 graph→assistant→user→thread;数据存储 PG/pgvector/Redis 按命名空间隔离。</desc>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0969da"/></marker>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
.ttl{font-weight:700;fill:#1f2328;}
.sub{fill:#57606a;}
.sm{fill:#57606a;}
.ac{fill:#0969da;font-weight:700;}
.port{fill:#1f2328;font-weight:700;}
.bx{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;}
.vbx{fill:#ffffff;stroke:#0969da;stroke-width:2;}
.inbx{fill:#f6f8fa;stroke:#d8dee4;stroke-width:1;}
.pill{fill:#eaeef2;stroke:#d0d7de;stroke-width:1;}
.line{stroke:#57606a;stroke-width:1.5;fill:none;}
.thin{stroke:#d8dee4;stroke-width:1;fill:none;}
.dash{stroke:#0969da;stroke-width:2;stroke-dasharray:6 4;fill:none;}
.aline{stroke:#0969da;stroke-width:2;fill:none;}
</style>
</defs>
<rect x="0" y="0" width="1080" height="1380" fill="#ffffff"/>

<rect x="110" y="14" width="16" height="12" class="bx" rx="2"/>
<text x="132" y="24" class="sm" font-size="11">原架构 (Aegra / 你的图)</text>
<rect x="310" y="14" width="16" height="12" class="vbx" rx="2"/>
<text x="332" y="24" class="ac" font-size="11">新增 · 实时语音</text>
<line x1="500" y1="20" x2="526" y2="20" class="dash"/>
<text x="532" y="24" class="ac" font-size="11">打断 barge-in</text>
<text x="1048" y="24" class="sm" font-size="10.5" text-anchor="end">❄ 静态/需重启　🔥 动态·热更新</text>

<rect x="110" y="50" width="300" height="68" class="bx" rx="8"/>
<text x="260" y="75" class="ttl" font-size="14" text-anchor="middle">语音客户端</text>
<text x="260" y="95" class="sub" font-size="11" text-anchor="middle">Web · 移动端</text>
<text x="260" y="110" class="sub" font-size="11" text-anchor="middle">麦克风采集 · 扬声器播放</text>
<rect x="460" y="50" width="270" height="68" class="bx" rx="8"/>
<text x="595" y="75" class="ttl" font-size="14" text-anchor="middle">文本客户端</text>
<text x="595" y="95" class="sub" font-size="11" text-anchor="middle">API · SDK · Agent Chat UI</text>
<text x="595" y="110" class="sub" font-size="11" text-anchor="middle">(非语音 · 原路径)</text>

<path d="M260,118 V168" class="aline" marker-end="url(#ab)"/>
<text x="252" y="144" class="ac" font-size="10.5" text-anchor="end">WebRTC / WS</text>
<text x="252" y="157" class="ac" font-size="10.5" text-anchor="end">实时双向音频</text>
<path d="M595,118 V138 H742 V334 H694 V342" class="line" marker-end="url(#a)"/>
<text x="747" y="148" class="port" font-size="10.5">→ :2026</text>
<text x="747" y="161" class="sm" font-size="10.5">直连</text>

<rect x="110" y="170" width="620" height="128" class="vbx" rx="8"/>
<text x="124" y="191" class="ac" font-size="14">🎙 实时语音网关　(Aegra 外 · 本次新增)</text>
<rect x="125" y="202" width="185" height="60" class="inbx" rx="6"/>
<text x="217" y="226" class="ttl" font-size="12.5" text-anchor="middle">STT 流式识别</text>
<text x="217" y="245" class="sub" font-size="11" text-anchor="middle">语音 → 文本</text>
<rect x="325" y="202" width="185" height="60" class="inbx" rx="6"/>
<text x="417" y="226" class="ttl" font-size="12.5" text-anchor="middle">VAD 打断检测</text>
<text x="417" y="245" class="sub" font-size="11" text-anchor="middle">barge-in · 停 TTS</text>
<rect x="525" y="202" width="195" height="60" class="inbx" rx="6"/>
<text x="622" y="226" class="ttl" font-size="12.5" text-anchor="middle">TTS 流式合成</text>
<text x="622" y="245" class="sub" font-size="11" text-anchor="middle">文本→语音 · 边收边播</text>
<text x="420" y="283" class="sm" font-size="10.5" text-anchor="middle">自建 Deepgram/Whisper+TTS ｜ 或一体化 OpenAI Realtime · Gemini Live · Deepgram VA</text>

<path d="M420,298 V342" class="line" marker-end="url(#a)"/>
<text x="435" y="316" class="sm" font-size="10.5">文本 · Agent Protocol → <tspan class="port">:2026</tspan></text>
<text x="435" y="331" class="ac" font-size="10.5">↓ runs/stream 输入　↑ token 流 → TTS</text>

<rect x="110" y="344" width="620" height="104" class="bx" rx="8"/>
<rect x="624" y="351" width="98" height="22" class="pill" rx="11"/>
<text x="673" y="366" class="port" font-size="12" text-anchor="middle">:2026 API</text>
<text x="406" y="366" class="ttl" font-size="14" text-anchor="middle">Aegra Web · FastAPI　(控制平面 · 平台自带)</text>
<text x="420" y="387" class="sub" font-size="11.5" text-anchor="middle">认证 JWT/OAuth2 · Assistants / Threads / Runs · SSE</text>
<text x="420" y="406" class="sub" font-size="11.5" text-anchor="middle">runs/stream token 流 ｜ <tspan class="ac">runs/{id}/cancel ← 打断目标</tspan></text>
<text x="420" y="425" class="sub" font-size="11.5" text-anchor="middle">自定义路由 · 旁路路由 (FastAPI 直连 · 不走 run)</text>

<path d="M730,234 H752 V398 H716" class="dash" marker-end="url(#ab)"/>
<rect x="748" y="298" width="300" height="116" class="vbx" rx="8" stroke-dasharray="6 4"/>
<text x="760" y="320" class="ac" font-size="12.5">打断 barge-in 回路 (网关侧)</text>
<text x="760" y="342" class="sm" font-size="11">① 本地立即停 TTS (~100ms)</text>
<text x="760" y="360" class="sm" font-size="11">② POST runs/{id}/cancel 取消生成</text>
<text x="760" y="378" class="sm" font-size="11">③ 截断已播文本 → 写回 thread</text>
<text x="760" y="396" class="sm" font-size="11">④ STT 收新输入 → 发新 run</text>

<rect x="748" y="438" width="300" height="158" class="bx" rx="8"/>
<text x="760" y="460" class="ttl" font-size="12.5">对外端口</text>
<rect x="760" y="470" width="278" height="26" class="pill" rx="6"/>
<text x="770" y="487" class="port" font-size="11.5">:2026　Aegra API · Agent Protocol</text>
<text x="770" y="510" class="sm" font-size="11">★ 主要调用入口</text>
<text x="770" y="527" class="sm" font-size="10">(assistants/threads/runs/stream → :2026)</text>
<text x="770" y="549" class="sm" font-size="11">:3000　Agent Chat UI (passthrough)</text>
<text x="770" y="567" class="sm" font-size="11">:5432　PostgreSQL (127.0.0.1 内网)</text>
<text x="770" y="585" class="sm" font-size="11">:6379　Redis (127.0.0.1 内网)</text>

<path d="M420,448 V478" class="line" marker-end="url(#a)"/>
<rect x="110" y="480" width="620" height="72" class="bx" rx="8"/>
<text x="420" y="504" class="ttl" font-size="14" text-anchor="middle">WorkerExecutor　(平台自带)</text>
<text x="420" y="524" class="sub" font-size="11.5" text-anchor="middle">Redis 队列 · Runner Pool · 租约崩溃恢复 · LangGraph runtime</text>
<text x="420" y="542" class="ac" font-size="10.5" text-anchor="middle">实时对话走快车道尽量绕队列 · 长任务走队列</text>

<path d="M420,552 V578" class="line" marker-end="url(#a)"/>
<text x="730" y="574" class="sm" font-size="10.5" text-anchor="end">❄ graph 静态:aegra.json 注册,改需重启</text>
