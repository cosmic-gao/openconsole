<path d="M404,882 H418" class="line" marker-end="url(#a)"/>
<rect x="420" y="862" width="128" height="40" class="inbx" rx="6"/>
<text x="484" y="879" class="ttl" font-size="11" text-anchor="middle">下一个 run</text>
<text x="484" y="894" class="sm" font-size="9.5" text-anchor="middle">agent 扫描 Store</text>
<path d="M548,882 H562" class="line" marker-end="url(#a)"/>
<rect x="564" y="862" width="156" height="40" class="vbx" rx="6"/>
<text x="642" y="879" class="ac" font-size="11" text-anchor="middle">🔥 生效</text>
<text x="642" y="894" class="sm" font-size="9.5" text-anchor="middle">不重启·不改代码·不改 aegra.json</text>
<text x="124" y="926" class="sm" font-size="10.5">渐进式披露:① 启动读 name+description　② 任务匹配读 SKILL.md 正文　③ 执行才读 scripts/refs/assets</text>
<text x="124" y="945" class="sm" font-size="10">三种 backend:Filesystem(改挂载文件需重启刷元数据) ｜ <tspan class="ac">Store(写库即热更新,可按租户,推荐)</tspan> ｜ State(每次 invoke 传入)</text>
<text x="124" y="963" class="sm" font-size="10">skill 内容随 assistant config 选择加载哪些 → 配合"assistant 动态"实现按租户能力开关</text>

