<text x="184" y="879" class="ttl" font-size="11" text-anchor="middle">管理端 / CMS</text>
<text x="184" y="894" class="sm" font-size="9.5" text-anchor="middle">编辑 SKILL.md</text>
<path d="M248,882 H262" class="line" marker-end="url(#a)"/>
<rect x="264" y="862" width="140" height="40" class="inbx" rx="6"/>
