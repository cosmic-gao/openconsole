<text x="208" y="643" class="ac" font-size="10.5" text-anchor="middle">主协作 · 实时</text>
<text x="208" y="658" class="ac" font-size="10.5" text-anchor="middle">(语音的"大脑")</text>
<text x="208" y="680" class="sub" font-size="10" text-anchor="middle">middleware + skills</text>
<text x="208" y="693" class="sub" font-size="10" text-anchor="middle">模型 / FS / 规划</text>
<rect x="316" y="582" width="196" height="120" class="bx" rx="8"/>
<text x="414" y="604" class="ttl" font-size="12.5" text-anchor="middle">analysis graph</text>
<text x="414" y="621" class="sub" font-size="11" text-anchor="middle">deepagents</text>
<text x="414" y="645" class="sub" font-size="10.5" text-anchor="middle">异步 · 长任务</text>
<text x="414" y="667" class="sub" font-size="10.5" text-anchor="middle">回放 / 摘要</text>
<text x="414" y="687" class="sub" font-size="10.5" text-anchor="middle">sub-agent 隔离上下文</text>
<rect x="522" y="582" width="208" height="120" class="bx" rx="8"/>
<text x="626" y="604" class="ttl" font-size="12.5" text-anchor="middle">轻量旁路角色</text>
<text x="626" y="626" class="sub" font-size="10.5" text-anchor="middle">无状态 · 单次</text>
<text x="626" y="646" class="sub" font-size="10.5" text-anchor="middle">校验器 · 路由 · filter</text>
<text x="626" y="668" class="sub" font-size="10.5" text-anchor="middle">FastAPI 直连</text>
<text x="626" y="684" class="sub" font-size="10.5" text-anchor="middle">不走 run</text>

