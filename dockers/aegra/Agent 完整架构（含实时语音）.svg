<text x="420" y="1272" class="sub" font-size="11" text-anchor="middle">PostgreSQL <tspan class="port">:5432</tspan>　checkpoint + Store(长期记忆 + Skill) + pgvector 向量</text>
<text x="420" y="1290" class="sub" font-size="11" text-anchor="middle">Redis <tspan class="port">:6379</tspan> 队列/缓存/PubSub　·　按 tenant_id / user_id namespace 隔离</text>

<line x1="110" y1="1320" x2="1048" y2="1320" class="line" stroke-dasharray="2 3"/>
<text x="110" y="1342" class="ac" font-size="11.5">核心原则:</text>
<text x="110" y="1360" class="sub" font-size="10.5">音频不进 Aegra · graph 静态(重启) / assistant 动态(API) / skill 热更新(写 Store) · 每租户独立 Assistant+Thread · 唯一入口 :2026</text>
</svg>