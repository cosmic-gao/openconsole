<text x="420" y="786" class="sub" font-size="11.5" text-anchor="middle">→ OpenAI · Anthropic · Gemini · 本地 (远程 mspbots aigateway · 需流式透传)</text>

<rect x="748" y="614" width="300" height="250" class="bx" rx="8"/>
<text x="760" y="636" class="ttl" font-size="12.5">三种变更热度 (本次补充)</text>
<text x="760" y="662" class="port" font-size="11.5">❄ Graph — 静态 / 冷</text>
<text x="760" y="679" class="sm" font-size="10.5">代码·拓扑 · aegra.json 注册</text>
<text x="760" y="694" class="sm" font-size="10.5">改 → build + 重启 aegra</text>
<line x1="760" y1="706" x2="1036" y2="706" class="thin"/>
<text x="760" y="728" class="port" font-size="11.5">🔥 Assistant — 动态 / 热</text>
<text x="760" y="745" class="sm" font-size="10.5">配置实例 · API 在线 CRUD + 版本</text>
<text x="760" y="760" class="sm" font-size="10.5">即时生效 · 无重启 · 每租户一个</text>
<line x1="760" y1="772" x2="1036" y2="772" class="thin"/>
<text x="760" y="794" class="port" font-size="11.5">🔥 Skill — 热更新</text>
<text x="760" y="811" class="sm" font-size="10.5">SKILL.md 能力包 · 存 Store(按租户)</text>
<text x="760" y="826" class="sm" font-size="10.5">写库即下个 run 生效</text>
<text x="760" y="841" class="sm" font-size="10.5">渐进披露:元数据→正文→资源</text>
<text x="760" y="857" class="sm" font-size="10.5">Filesystem 改文件需重启刷元数据</text>

<line x1="110" y1="814" x2="730" y2="814" class="thin" stroke-dasharray="3 3"/>
